[package]
name = "etke_openai_api_rust"
version = "0.1.10"
authors = ["i@gt.email","craig@mayhew.io", "slavi@devture.com"]
edition = "2021"
license = "MIT"
repository = "https://github.com/etkecc/openai_api_rust"
description = "(Temporary etke.cc fork) A very simple Rust library for OpenAI API, free from complex async operations and redundant dependencies."
keywords = ["openai_api", "openai", "openai-api"]
categories = ["api-bindings"]

[dependencies]
# `native-certs` makes ureq build its rustls root store from the system trust store
# (rustls-native-certs, honouring SSL_CERT_FILE) instead of the bundled webpki-roots.
# Without it, endpoints behind a private/internal CA (FreeIPA, org PKI) fail the TLS
# handshake with "invalid peer certificate: UnknownIssuer".
ureq = { version = "^2.6", features = ["json", "native-certs"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
log = "^0.4"
mime = "^0.3.16"
rand = "0.8.5"
